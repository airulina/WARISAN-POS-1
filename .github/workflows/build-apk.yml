name: Build WARISAN POS APK

on:
  push:
    branches: ["main", "ci/stock-apk-v346"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WARISAN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret WARISAN_DEBUG_KEYSTORE_BASE64 belum diisi."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey > /dev/null
      - name: Show SHA-1
        run: |
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android

      - name: Verify no paid Firebase Functions in app
        run: |
          if grep -q "firebase-functions" app/build.gradle; then
            echo "Cloud Functions dependency detected in Spark-only app"
            exit 1
          fi

      - name: Verify five themes and readable text contrast
        run: node tests/theme-contrast-smoke.mjs

      - name: Verify Owner profit and product charts
        run: node tests/owner-finance-smoke.mjs

      - name: Verify Live stock sold and balance display
        run: node tests/live-stock-smoke.mjs

      - name: Verify staff closing ledger and archived reports
        run: node tests/staff-closing-smoke.mjs

      - name: Verify v3.46 navigation and Owner UI restoration
        run: node tests/v346-ui-restoration-smoke.mjs

      - name: Verify compact chart and second-screen branch periods
        run: node tests/owner-branch-period-smoke.mjs

      - name: Verify Stock UI matches reference without changing stock logic
        run: node tests/stock-ui-reference-smoke.mjs

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK package archive
        run: unzip -t app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WARISAN-POS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Clean up signing key
        if: always()
        run: rm -f "$HOME/.android/debug.keystore"
