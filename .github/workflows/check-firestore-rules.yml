name: Check Firebase Spark Security Rules
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firebase.json
      - tests/**
      - .github/workflows/check-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
        working-directory: tests
      - name: Install Firebase Emulator CLI
        run: npm install --global firebase-tools@14
      - name: Check Owner / Staff / LIVE access against real Firestore rules engine
        run: firebase emulators:exec --only firestore --project demo-warisan-pos-live "cd tests && npm test"
