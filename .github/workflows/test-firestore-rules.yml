name: Test WARISAN POS Firestore Rules

on:
  push:
    branches: ["main"]
    paths:
      - "firestore.rules"
      - "tests/**"
      - "firebase.json"
      - ".github/workflows/test-firestore-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Rules Test Dependencies
        run: npm install --prefix tests --no-audit --no-fund
      - name: Verify owner/staff rules in Firestore Emulator
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-warisan-pos-live "npm --prefix tests test"
