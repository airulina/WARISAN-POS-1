name: Test WARISAN POS Languages

on:
  push:
    branches: ["main"]
    paths:
      - "app/src/main/java/my/warisan/pos/WarisanLanguage.java"
      - "tests/WarisanLanguageSmoke.java"
      - ".github/workflows/test-language.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bilingual-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify Malay (Malaysia) and English display strings
        run: |
          mkdir -p /tmp/warisan-i18n
          javac -encoding UTF-8 -d /tmp/warisan-i18n \
            app/src/main/java/my/warisan/pos/WarisanLanguage.java \
            tests/WarisanLanguageSmoke.java
          java -cp /tmp/warisan-i18n my.warisan.pos.WarisanLanguageSmoke
